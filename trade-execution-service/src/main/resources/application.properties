spring.application.name=trade-execution-service
server.port=9093
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_trading_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

balance.margin.service.url=http://localhost:9091
upstox.order-url=https://api-hft.upstox.com/v3/order/place
broker.service.base-url=http://localhost:9090
# Master switch for real broker orders. Override with EXECUTION_LIVE_ENABLED=true at launch.
execution.live-enabled=${EXECUTION_LIVE_ENABLED:false}

execution.reconciliation.max-attempts=10
execution.reconciliation.interval-ms=500
# Upstox enhanced order endpoint used for modifying open/pending orders
upstox.order-modify-url=https://api-hft.upstox.com/v2/order/modify

# Bounded broker/HTTP calls. A timed-out placement is reconciled by tag, never retried blindly.
execution.http.connect-timeout-ms=5000
execution.http.response-timeout-ms=10000

# Market zone defining the trading day (used to retire state left from an earlier session).
# Entry windows and square-off timing are owned by signal-engine (trading.market.*).
execution.market.zone=Asia/Kolkata

# Hard execution backstops for the Rs 20,000 pilot (0 disables a limit).
# Trading risk, including the daily loss limit, is owned by signal-engine
# (trading.risk.max-daily-loss); these only catch a sizing bug.
# Must stay consistent with signal-engine trading.margin-per-trade.
execution.risk.max-margin-per-trade=10000
execution.risk.max-open-positions=2
execution.risk.max-entries-per-day=6

# Stops and targets are aligned to this tick before they reach the broker
# (NSE rejects trigger prices that are not tick multiples; 0.05 is valid for all equities).
execution.price.tick-size=0.05

# An exit claim that never produced a broker order (confirmed absent from broker
# history) is released back to OPEN after this many seconds so it can be exited again.
execution.exit.unsubmitted-claim-release-seconds=60
