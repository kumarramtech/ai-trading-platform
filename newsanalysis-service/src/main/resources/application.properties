spring.application.name=newsanalysis-service
server.port=8088
google.news.rss-url=https://news.google.com/rss/search?q=%s+NSE+India
newsapi.base-url=https://api.massive.com/v2/reference/news
newsapi.api-key=${NEWSAPI_API_KEY}
news.max-age-hours=24
news.max-articles=5

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

ai.service.base-url=http://localhost:8086

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice

spring.jpa.hibernate.ddl-auto=update


# Async (Mono) controller responses. /news/market-trend/stocks makes two AI calls
# (Gemini alone took ~40s on 2026-10-27); the 30s container default returned 503.
spring.mvc.async.request-timeout=180s
