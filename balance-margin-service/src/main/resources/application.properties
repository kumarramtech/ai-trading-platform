spring.application.name=balance-margin-service
server.port=9091
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
broker.service.base-url=http://localhost:9090
upstox.base-url=https://api.upstox.com
# Capital the bot may use (paper and live). Override with TRADING_ALLOCATED_CAPITAL.
# Paper: the paper account is reset to this every weekday at 08:30 IST; each paper trade
#        reserves/releases margin here.
# Live : sizing uses min(Upstox funds, this budget minus Upstox funds used since the first
#        check of the day), so a Rs 2L account with a Rs 1L budget trades only Rs 1L.
trading.allocated-capital=${TRADING_ALLOCATED_CAPITAL:100000}
paper.trading.initial-balance=${trading.allocated-capital}
# paper | live. Live sizing uses real Upstox funds instead of the paper account.
balance.source=${EXECUTION_TRADE:paper}

