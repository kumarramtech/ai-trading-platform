spring.application.name=broker-auth-service
server.port:9090
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

market.provider=upstox
upstox.client-id=${UPSTOX_CLIENT_ID}
upstox.client-secret=${UPSTOX_CLIENT_SECRET}
upstox.redirect-uri=http://localhost:9090/upstox/callback
upstox.token-url=https://api.upstox.com/v2/login/authorization/token
upstox.analytics-token=${UPSTOX_ANALYTICS_TOKEN}
upstox.base-url=https://api.upstox.com/
upstox.authorization-url=https://api.upstox.com/v2/login/authorization/dialog
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000
spring.data.redis.repositories.enabled=false

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice

