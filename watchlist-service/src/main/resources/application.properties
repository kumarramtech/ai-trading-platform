spring.application.name=watchlist-service

server.port=9092

stock.service.base-url=http://localhost:8081
signal.engine.base-url=http://localhost:8082
news.analysis.service.base-url=http://localhost:8088
watchlist.max-size=100

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
watchlist.scheduler.enabled=true
watchlist.scheduler.cron=0 30 8 ? * MON-FRI
upstox.market.base-url=https://api.upstox.com
broker.auth.base-url=http://localhost:9090
