spring.application.name=ai-service
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
server.port=8086
spring.ai.openai.chat.options.model=gpt-5.6-luna
ai.provider.openai.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.timeout=3000
spring.data.redis.repositories.enabled=false
ai.prompt-optimizer.enabled=true

ai.circuit.failure-threshold=3
ai.circuit.open-duration=120
ai.circuit.success-threshold=1

ai.provider.openai.priority=2

##########################################
# Gemini
##########################################

spring.ai.vertex.ai.gemini.enabled=true

spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-3.6-flash

ai.provider.gemini.priority=3

ai.openrouter.enabled=true
ai.openrouter.api-key=${AI_OPENROUTER_API_KEY}
ai.openrouter.model=openrouter/free
ai.openrouter.timeout=10
# deepseek/deepseek-v4-pro

ai.openrouter.priority=4

# =====================================================
# DEEPSEEK AI PROVIDER
# =====================================================

ai.provider.deepseek.enabled=true
ai.provider.deepseek.api-key=${AI_PROVIDER_DEEPSEEK_API_KEY}
ai.provider.deepseek.model=deepseek-v4-flash
ai.provider.deepseek.priority=1

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice

# ============================================================
# AI CALL CONTROL / BUDGET PROTECTION
# ============================================================

ai.call-control.enabled=true

# Minimum time before the same unchanged symbol can be reconsidered
ai.call-control.min-recheck-seconds=30

# Re-evaluate when price changes by this percentage
ai.call-control.price-change-percent=0.25

# Re-evaluate when RSI changes by this amount
ai.call-control.rsi-change=2.0

# Re-evaluate when MACD changes by this percentage
ai.call-control.macd-change-percent=10.0

# Keep symbol evaluation state for the trading session
ai.call-control.state-ttl-hours=8
