spring.application.name=stock-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

market.provider=upstox

upstox.redirect-uri=http://localhost:8081/upstox/callback
upstox.base-url=https://api.upstox.com/v2

upstox.authorization-url=https://api.upstox.com/v2/login/authorization/dialog

upstox.token-url=https://api.upstox.com/v2/login/authorization/token
upstox.analytics-token=${UPSTOX_ANALYTICS_TOKEN}
upstox.market-url=https://api.upstox.com/v2
upstox.instrument.url= https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz
upstox.instrument.url.connect-timeout= 5000
upstox.instrument.url.read-timeout= 30000
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

bootstrap.history.lookback-days=365
bootstrap.history.max-symbols-per-run=500
bootstrap.history.thread-pool-size=1
bootstrap.enabled=true
bootstrap.cron=0 30 7 * * MON-FRI
bootstrap.history.interval=day
bootstrap.history.exchange=NSE
bootstrap.history.segment=NSE_EQ
bootstrap.history.instrument-type=EQ
broker.auth.base-url=http://localhost:9090
market.stream.base-url=http://localhost:8089

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice


# Earnings drift data (research only, 2026-11-11): Upstox quarterly income statements of the top companies,
# polled 08:30 / 15:40 / 21:00 IST; the first poll that sees a quarter dates its announcement. GET /earnings/collector/status
earnings.collector.enabled=true
earnings.collector.universe=500
# Scheduled jobs on 3 threads, so a long poll or bootstrap never delays another job.
spring.task.scheduling.pool.size=3
# Intraday short executor (2026-11-26): copies the FADE and F&O exclusion PAPER books into intraday (MIS) shorts.
# GET /short-exec, GET /short-exec/summary, POST /short-exec/run?book=fade|foex. DRY_RUN = nothing goes to Upstox.
# LIVE needs short-exec.<book>.mode=LIVE AND short-exec.live-confirm=REAL-MONEY (plus the registered static IP).
# stop-pct is a broker-side catastrophe stop the paper books do not have; foex covers 15:10 (paper 15:25 is after
# the broker's 15:20 square-off). Book stop: new entries stop after max-book-loss Rs (or max-loss-streak losses in a
# row) since start-date; move start-date to re-arm.
short-exec.live-confirm=
short-exec.buffer-pct=0.5
short-exec.fade.mode=DRY_RUN
short-exec.fade.positions=2
short-exec.fade.notional=40000
short-exec.fade.stop-pct=5
short-exec.fade.entry-until=10:00
short-exec.fade.force-cover=15:05
short-exec.fade.max-book-loss=5000
short-exec.fade.max-loss-streak=0
short-exec.fade.start-date=
short-exec.foex.mode=DRY_RUN
short-exec.foex.positions=2
short-exec.foex.notional=50000
short-exec.foex.stop-pct=5
short-exec.foex.entry-until=09:40
short-exec.foex.force-cover=15:10
short-exec.foex.max-book-loss=5000
short-exec.foex.max-loss-streak=4
short-exec.foex.start-date=
