spring.application.name=stock-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

market.provider=upstox

upstox.redirect-uri=http://localhost:8081/upstox/callback
upstox.base-url=https://api.upstox.com/v2

upstox.authorization-url=https://api.upstox.com/v2/login/authorization/dialog

upstox.token-url=https://api.upstox.com/v2/login/authorization/token
upstox.analytics-token=${UPSTOX_ANALYTICS_TOKEN}
upstox.market-url=https://api.upstox.com/v2
upstox.instrument.url= https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz
upstox.instrument.url.connect-timeout= 5000
upstox.instrument.url.read-timeout= 30000
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

bootstrap.history.lookback-days=365
bootstrap.history.max-symbols-per-run=500
bootstrap.history.thread-pool-size=1
bootstrap.enabled=true
bootstrap.cron=0 30 7 * * MON-FRI
bootstrap.history.interval=day
bootstrap.history.exchange=NSE
bootstrap.history.segment=NSE_EQ
bootstrap.history.instrument-type=EQ
broker.auth.base-url=http://localhost:9090
market.stream.base-url=http://localhost:8089

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice

