spring.application.name=signal-engine-service
server.port:8082

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
ai.service.url=http://localhost:8086
stock.service.url=http://localhost:8081
news.service.base-url=http://localhost:8088
portfolio.service.url=http://localhost:8083
market.sentiment.service.url=http://localhost:8086
balance.margin.service.url=http://localhost:9091
watchlist.service.url=http://localhost:9092
trading.capital-per-trade=10000
trading.margin-per-trade=10000
# Fallback and dashboard figure only. Paper capital is owned by balance-margin-service
# (paper.trading.initial-balance); keep the two equal.
trading.total-capital=100000
trading.min-available-capital=1000
# Hard exit trigger (gap/slippage backstop) on whole-trade P&L.
trading.risk.max-loss-per-trade=250
# Planned loss at the stop: quantity is capped so qty x |entry - stop| <= this (0 disables).
trading.risk.risk-per-trade=250
# New entries halt for the day once today's realized P&L reaches -max-daily-loss (paper and live).
trading.risk.max-daily-loss=2000
# New entries halt for the day after this many losing trades in a row.
trading.risk.max-consecutive-losses=3
# Must match trade-execution execution.risk.max-open-positions.
trading.risk.max-open-trades=2
# Dynamic Target Extension
trading.exit.dynamic-target.enabled=true
trading.exit.dynamic-target.min-minutes-remaining=120
trading.exit.dynamic-target.extension-percent=25
trading.ai.max-symbols-per-scan=20
trading.max-trades-per-symbol-per-day=3
trading.market.open=09:15
trading.market.preopen=09:00
trading.market.timezone=Asia/Kolkata
trading.market.strategy.entry.start=09:30
# Upstox auto-squares-off intraday equity at 15:20 (15:05 for CAS-eligible stocks) and
# rejects new intraday orders after 15:18 (15:03). Our square-off must finish first,
# otherwise the broker closes the position (Rs 59 per order) and our exit is rejected.
trading.market.entry.cut=14:30
trading.market.close=15:00
trading.market.end=15:30
trading.price.tick-size=0.05
# Paper and live: no new entry in a symbol for this long after its last exit.
trading.reentry.cooldown-minutes=15
# 12:00 entries from daily indicators, with no JUDAS/ORB trigger. Kept on in paper to
# gather results; review them before going live.
trading.strategy.midday.enabled=true
# paper | live. Live also needs execution.live-enabled=true here AND in trade-execution.
execution.trade=${EXECUTION_TRADE:paper}
paper.trading.trailing.enabled=true
paper.trading.trailing.step.multiplier=1.0
paper.trading.trailing.notification.enabled=true
trading.engineering.min-ai-confidence=60

# Trade Execution Service
trade.execution.service.url=${TRADE_EXECUTION_SERVICE_URL:http://localhost:9093}

# Keep LIVE execution disabled unless EXECUTION_LIVE_ENABLED=true at launch.
execution.live-enabled=${EXECUTION_LIVE_ENABLED:false}
# Entry/exit calls may take >10s when the broker is slow (place, confirm, broker stop).
trade.execution.service.response-timeout-seconds=30

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice


