spring.application.name=signal-engine-service
server.port:8082

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
ai.service.url=http://localhost:8086
stock.service.url=http://localhost:8081
news.service.base-url=http://localhost:8088
portfolio.service.url=http://localhost:8083
market.sentiment.service.url=http://localhost:8086
balance.margin.service.url=http://localhost:9091
watchlist.service.url=http://localhost:9092
trading.capital-per-trade=10000
trading.margin-per-trade=10000
# Fallback and dashboard figure only. Paper capital is owned by balance-margin-service
# (paper.trading.initial-balance); keep the two equal.
trading.total-capital=100000
trading.min-available-capital=1000
# Hard exit trigger (gap/slippage backstop) on whole-trade P&L.
trading.risk.max-loss-per-trade=250
# Planned loss at the stop: quantity is capped so qty x |entry - stop| <= this (0 disables).
trading.risk.risk-per-trade=250
# The only whole-day stop: new entries halt once today's realized P&L reaches -max-daily-loss (paper and live).
trading.risk.max-daily-loss=2000
# Losing streak across all symbols that halts the day; 0 = off (the daily loss above is the day stop).
trading.risk.max-consecutive-losses=0
# A symbol with this many real losses today (scratches excluded) takes no more entries today;
# other symbols keep trading. 0 = off.
trading.risk.max-losses-per-symbol-per-day=3
# Must match trade-execution execution.risk.max-open-positions.
trading.risk.max-open-trades=2
# Dynamic Target Extension
trading.exit.dynamic-target.enabled=true
trading.exit.dynamic-target.min-minutes-remaining=120
trading.exit.dynamic-target.extension-percent=25
trading.ai.max-symbols-per-scan=20
# Overtrading cap per symbol (wins included); the loss rule above is what blocks a losing symbol.
trading.max-trades-per-symbol-per-day=6
trading.market.open=09:15
trading.market.preopen=09:00
trading.market.timezone=Asia/Kolkata
trading.market.strategy.entry.start=09:30
# Upstox auto-squares-off intraday equity at 15:20 (15:05 for CAS-eligible stocks) and
# rejects new intraday orders after 15:18 (15:03). Our square-off must finish first,
# otherwise the broker closes the position (Rs 59 per order) and our exit is rejected.
trading.market.entry.cut=14:30
trading.market.close=15:00
trading.market.end=15:30
trading.price.tick-size=0.05
# Paper and live: no new entry in a symbol for this long after its last exit.
trading.reentry.cooldown-minutes=15
# Entries are searched for continuously from 09:30 to the 14:30 entry cut:
# JUDAS 09:30-10:30 (opening sweep), ORB breakout-retest until trading.strategy.orb.end.
trading.strategy.orb.end=14:30
# MIDDAY entries from daily indicators, with no JUDAS/ORB trigger; counter-trend entries are
# vetoed by the live index regime. Discovery every 30 min from 11:00, revalidation + entry
# 15 min later (11:15 ... 14:15). Kept on in paper to gather results; review before live.
trading.strategy.midday.enabled=true
trading.strategy.midday.discovery-cron=0 0/30 11-14 * * MON-FRI
trading.strategy.midday.revalidation-cron=0 15/30 11-14 * * MON-FRI
# paper | live. Live also needs execution.live-enabled=true here AND in trade-execution.
execution.trade=${EXECUTION_TRADE:paper}
# Paper behaves like live: MARKET fills at the execution-time price with adverse slippage
# (per side, % of price), and P&L is booked net of the charges below.
paper.trading.slippage-pct=0.03
# Upstox NSE intraday equity charges (verify against a contract note when rates change).
trading.charges.brokerage-pct=0.1
trading.charges.brokerage-max-per-order=20
trading.charges.stt-sell-pct=0.025
trading.charges.exchange-txn-pct=0.00297
trading.charges.sebi-pct=0.0001
trading.charges.stamp-buy-pct=0.003
trading.charges.gst-pct=18
# Strategy performance: a group needs this many closed trades before its verdict is trusted.
trading.performance.min-trades=20
# Edge gate: skip setups whose strategy + entry time lost money (net) over the lookback,
# once they have min-trades. Report: GET /analytics/strategy-performance, /analytics/edge-gate
trading.edge-gate.enabled=true
trading.edge-gate.lookback-days=30
trading.edge-gate.min-expectancy=0
# Setup quality 0-100 (volume, regime, NIFTY momentum, daily trend, RSI room, track record).
# Setups below min-score are skipped; when one open slot is left it is kept for >= last-slot-min-score.
# Check the score earns its keep in /analytics/strategy-performance -> byQualityScore.
trading.quality.min-score=40
trading.quality.last-slot-min-score=60
paper.trading.trailing.enabled=true
paper.trading.trailing.step.multiplier=1.0
paper.trading.trailing.notification.enabled=true
trading.engineering.min-ai-confidence=60

# Trade Execution Service
trade.execution.service.url=${TRADE_EXECUTION_SERVICE_URL:http://localhost:9093}

# Keep LIVE execution disabled unless EXECUTION_LIVE_ENABLED=true at launch.
execution.live-enabled=${EXECUTION_LIVE_ENABLED:false}
# Entry/exit calls may take >10s when the broker is slow (place, confirm, broker stop).
trade.execution.service.response-timeout-seconds=30

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice


