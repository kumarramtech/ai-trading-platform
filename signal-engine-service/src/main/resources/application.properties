spring.application.name=signal-engine-service
server.port:8082

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
ai.service.url=http://localhost:8086
stock.service.url=http://localhost:8081
news.service.base-url=http://localhost:8088
portfolio.service.url=http://localhost:8083
market.sentiment.service.url=http://localhost:8086
balance.margin.service.url=http://localhost:9091
watchlist.service.url=http://localhost:9092
trading.capital-per-trade=10000
trading.margin-per-trade=10000
# Fallback and dashboard figure only. Paper capital is owned by balance-margin-service
# (paper.trading.initial-balance); keep the two equal.
trading.total-capital=100000
trading.min-available-capital=1000
# Liquidity: trade only stocks that can be exited near the planned price (0 = off).
# Paper slippage of 0.03% is not real on a Rs 18 stock or a thin SME counter.
trading.liquidity.min-price=50
trading.liquidity.min-average-turnover-crore=5
# Hard exit trigger (gap/slippage backstop) on whole-trade P&L.
trading.risk.max-loss-per-trade=250
# Planned loss at the stop: quantity is capped so qty x |entry - stop| plus slippage and
# round-trip charges <= this (0 disables; costs off via trading.risk.include-costs-in-sizing=false).
# User rule 2026-11-02: fixed Rs 250 the most a trade may lose (was 400 from 2026-10-29); margin-per-trade
# x 5x leverage is still the most a trade may carry.
trading.risk.risk-per-trade=250
# The only whole-day stop: new entries halt once today's realized P&L reaches -max-daily-loss (paper and live).
trading.risk.max-daily-loss=2000
# Losing streak across all symbols that halts the day; 0 = off (the daily loss above is the day stop).
trading.risk.max-consecutive-losses=0
# A symbol with this many real losses today (scratches excluded) takes no more entries today;
# other symbols keep trading. 0 = off.
trading.risk.max-losses-per-symbol-per-day=3
# Must match trade-execution execution.risk.max-open-positions. User rule 2026-10-29: no limit on
# open trades; 10 = what Rs 1 lakh holds at Rs 10k margin each (capital is the real limit).
trading.risk.max-open-trades=10
# A setup whose own stop (sweep extreme / opening-range level) is closer than this % of entry
# is skipped instead of widened. 0 = off.
trading.execution-plan.min-stop-pct=0.60
# User rule 2026-10-30: a wide opening-range / sweep stop is not a reason to skip a setup; it goes on
# to the AI and the risk-per-trade sizing keeps the stop-out loss at Rs 250 (smaller position instead).
# Raised from 1.0 (which rejected 43 of 71 setups on the volatile Oct 30 open); 5% only stops absurd ranges.
trading.execution-plan.max-risk-pct=5.0
# 2026-11-02 review: a 2R target on a wide stop landed 4-8% away, which an intraday trade rarely reaches.
# The target is capped at max-target-pct from entry; a setup left paying less than min-reward-risk R
# is skipped as TARGET_OUT_OF_REACH (followed as a shadow). In effect stops wider than 2.5% are skipped.
trading.execution-plan.max-target-pct=2.5
trading.execution-plan.min-reward-risk=1.0
# Entry guards (2026-11-02: 9 ORB longs opened 09:35-09:40 on a +0.75% NIFTY gap, all faded together).
# CHASED: no ORB entry already more than max-move-from-open-pct past today's open in the trade direction.
trading.entry.open-move-strategies=ORB
trading.entry.max-move-from-open-pct=1.5
# GAP_DAY_WAIT: when NIFTY opens min-gap-pct or more away from the previous close, no ORB entry before wait-until.
trading.entry.gap-day.min-gap-pct=0.5
trading.entry.gap-day.wait-until=10:00
# DIRECTION_CAP: at most this many open trades long (and the same short). 0 = off.
trading.risk.max-open-per-direction=3
# ENTRY_BURST: at most max-entries new trades in any window-minutes. 0 = off.
trading.risk.entry-burst.max-entries=2
trading.risk.entry-burst.window-minutes=15
# OPEN_RISK: realized net today - risk still open at the current stops - this trade's risk-per-trade
# must stay above -max-daily-loss, so open trades cannot overrun the day stop.
trading.risk.open-risk-in-daily-loss=true
# Stored on every paper and shadow trade (rule_version); change it whenever a trading rule changes.
trading.rules.version=2026-11-03
# Dynamic Target Extension
trading.exit.dynamic-target.enabled=true
trading.exit.dynamic-target.min-minutes-remaining=120
trading.exit.dynamic-target.extension-percent=25
trading.ai.max-symbols-per-scan=20
# Overtrading cap per symbol (wins included); the loss rule above is what blocks a losing symbol.
trading.max-trades-per-symbol-per-day=6
trading.market.open=09:15
trading.market.preopen=09:00
# FADE paper book (Round 4 C1): at 09:45 short the 5 biggest of ranks 501-600 up >= 2% vs NIFTY, hold to 15:00, no stop.
# daily-stop 10000 is a catastrophe cap only, beyond the replay's worst day (-8571); Round 3 showed a tight day stop kills the edge.
# Paper only, separate table (fade_paper_trade); the live engine is unaffected. 0 = none for the Rs limits.
trading.fade-book.enabled=true
trading.fade-book.positions=5
trading.fade-book.notional=40000
trading.fade-book.stop-pct=0
trading.fade-book.daily-stop=10000
trading.fade-book.take-profit=0
trading.fade-book.nifty-up-only=false
# Pool (1-based turnover ranks, inclusive) and filters; Round 4 rows map onto these.
# positions 0 = every candidate; stop-pct 0 = no stop; spike = 5-session turnover / 20-session (0 = off).
trading.fade-book.pool-from-rank=501
trading.fade-book.pool-to-rank=600
trading.fade-book.min-move=2
trading.fade-book.max-move=0
trading.fade-book.min-turnover-spike=0
trading.fade-book.max-turnover-spike=0
trading.fade-book.min-gap=-100
trading.fade-book.max-gap=100
trading.market.timezone=Asia/Kolkata
trading.market.strategy.entry.start=09:30
# Upstox auto-squares-off intraday equity at 15:20 (15:05 for CAS-eligible stocks) and
# rejects new intraday orders after 15:18 (15:03). Our square-off must finish first,
# otherwise the broker closes the position (Rs 59 per order) and our exit is rejected.
trading.market.entry.cut=14:30
trading.market.close=15:00
trading.market.end=15:30
trading.price.tick-size=0.05
# Paper and live: no new entry in a symbol for this long after its last exit.
trading.reentry.cooldown-minutes=15
# Entries are searched for continuously from 09:30 to the 14:30 entry cut:
# JUDAS 09:30-10:30 (opening sweep), ORB breakout-retest until trading.strategy.orb.end.
# 12:30, not the 14:30 entry cut: an OR breakout hours after the range formed carries little
# information (2026-10-27: ORB shorts at 14:07 and 14:18 both lost).
trading.strategy.orb.end=12:30
# No entry in the direction of a regime flip younger than this many minutes (0 = off).
trading.regime.fresh-flip-minutes=5
# Counter-regime ORB (SELL in BULLISH / BUY in BEARISH) is normally vetoed. Exception when the
# stock moves on its own: move since today's open against NIFTY's (same basis) >= min-relative-pct, setup volume >= min-volume-ratio
# x the opening-range average, and quality >= min-quality (a counter-regime setup scores at most 70).
# Traded as ORB_RS so its results are reported separately. Paper only unless .live=true.
trading.regime.counter-trend-exception.enabled=true
trading.regime.counter-trend-exception.live=false
trading.regime.counter-trend-exception.min-relative-pct=1.5
trading.regime.counter-trend-exception.min-volume-ratio=2.0
trading.regime.counter-trend-exception.min-quality=55
# Setups rejected by REGIME_GUARD, FRESH_REGIME_FLIP, MIDDAY_SIDEWAYS, EXTENDED or AI_VETO are followed
# as shadow trades (table shadow_trade, gross R, no position) to measure what each filter costs.
trading.shadow.enabled=true
# Skip, rather than clamp to max-risk-pct, an opening-range stop that is too far away.
trading.execution-plan.reject-clamped-or-stop=true
# MIDDAY entries from daily indicators, with no JUDAS/ORB trigger; counter-trend entries are
# vetoed by the live index regime. Discovery every 30 min from 11:00, revalidation + entry
# 15 min later (11:15 ... 14:15). Kept on in paper to gather results; review before live.
trading.strategy.midday.enabled=true
# No MIDDAY entry while the live index regime is SIDEWAYS (daily movers rarely carry on in a range).
trading.strategy.midday.skip-sideways=true
trading.strategy.midday.discovery-cron=0 0/30 11-14 * * MON-FRI
trading.strategy.midday.revalidation-cron=0 15/30 11-14 * * MON-FRI
# TREND_PULLBACK, SHADOW ONLY (never a position): 12:30-14:30, once the index regime has held
# BULLISH/BEARISH for min-regime-minutes, a stock up/down >= min-day-move-pct since the open that
# pulls back to its intraday VWAP and closes back on the trend side. Recorded as shadow_trade
# rejected_by=SHADOW_ONLY; promote to paper only if the go-live report shows it beats its charges.
# Opening playbook at 09:31: stocks whose first 15 minutes traded >= min-opening-rvol of their
# 20-day average daily volume ("in play"), logged + Slack, GET /analytics/opening-playbook.
# require-in-play=true restricts ORB/JUDAS to them (others become NOT_IN_PLAY shadows);
# keep false until POST /analytics/replay shows the rule pays after charges.
trading.playbook.enabled=true
trading.playbook.require-in-play=false
trading.playbook.min-opening-rvol=0.10
trading.strategy.trend-pullback.enabled=true
trading.strategy.trend-pullback.start=12:30
trading.strategy.trend-pullback.end=14:30
trading.strategy.trend-pullback.min-regime-minutes=30
trading.strategy.trend-pullback.min-day-move-pct=0.5
# paper | live. Live also needs execution.live-enabled=true here AND in trade-execution.
execution.trade=${EXECUTION_TRADE:paper}
# Paper behaves like live: MARKET orders fill against the live order book (buys lift the asks,
# sells hit the bids, walking up to 5 levels at the volume-weighted price), and P&L is booked
# net of the charges below. Without a fresh book (< max-age-ms old) the fill is slippage-pct worse.
paper.trading.slippage-pct=0.03
paper.trading.book-fill.enabled=true
paper.trading.book-fill.max-age-ms=10000
# Quantity beyond the 5 visible levels fills this % beyond the worst level.
paper.trading.book-fill.beyond-depth-penalty-pct=0.10
# A book fill this far from the reference price is treated as bad data (fixed slippage instead).
paper.trading.book-fill.max-deviation-pct=2.0
# Upstox NSE intraday equity charges (verify against a contract note when rates change).
trading.charges.brokerage-pct=0.1
trading.charges.brokerage-max-per-order=20
trading.charges.stt-sell-pct=0.025
trading.charges.exchange-txn-pct=0.00297
trading.charges.sebi-pct=0.0001
trading.charges.stamp-buy-pct=0.003
trading.charges.gst-pct=18
# Strategy performance: a group needs this many closed trades before its verdict is trusted.
trading.performance.min-trades=20
# Weekly go-live readiness (GET /analytics/go-live-readiness, Slack Fridays 15:45 IST).
# Judged from the first day of the current rule set; every criterion must pass to go live.
trading.go-live.measure-from=2026-11-03
trading.go-live.min-trades=60
trading.go-live.min-average-r=0.20
trading.go-live.min-profit-factor=1.3
trading.go-live.max-drawdown-r=10
# Projection toward the monthly target at 1% of capital risked per trade.
trading.go-live.scaled-risk-per-trade=1000
trading.go-live.monthly-profit-target=10000
trading.go-live.report-cron=0 45 15 * * FRI
# Edge gate: skip setups whose strategy + entry time lost money (net) over the lookback,
# once they have min-trades. Report: GET /analytics/strategy-performance, /analytics/edge-gate
trading.edge-gate.enabled=true
trading.edge-gate.lookback-days=30
trading.edge-gate.min-expectancy=0
# Setup quality 0-100 (volume, regime, NIFTY momentum, daily trend, RSI room, track record).
# Setups below min-score are skipped; when one open slot is left it is kept for >= last-slot-min-score.
# Check the score earns its keep in /analytics/strategy-performance -> byQualityScore.
trading.quality.min-score=40
trading.quality.last-slot-min-score=60
paper.trading.trailing.enabled=true
paper.trading.trailing.step.multiplier=1.0
paper.trading.trailing.notification.enabled=true
trading.engineering.min-ai-confidence=60

# Trade Execution Service
trade.execution.service.url=${TRADE_EXECUTION_SERVICE_URL:http://localhost:9093}

# Keep LIVE execution disabled unless EXECUTION_LIVE_ENABLED=true at launch.
execution.live-enabled=${EXECUTION_LIVE_ENABLED:false}
# Entry/exit calls may take >10s when the broker is slow (place, confirm, broker stop).
trade.execution.service.response-timeout-seconds=30

#####################################################
# ACTUATOR
#####################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

#####################################################
# PROMETHEUS
#####################################################

management.prometheus.metrics.export.enabled=true

#####################################################
# JVM METRICS
#####################################################

management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

#####################################################
# APPLICATION INFO
#####################################################

management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=AI Trading Platform Microservice



# Monthly momentum list (delivery, manual orders): the rule the swing backtest locked on 2026-10-29.
# First weekday of each month, 08:50 IST (10:50 retry): top N of the liquid-rank most traded by
# 6m-1m return / volatility, equal weight; NIFTY below its regime-sma-day average = all cash.
# Slack + table momentum_signal; GET /analytics/momentum-signal previews, POST .../publish sends.
trading.momentum.enabled=true
trading.momentum.capital=30000
trading.momentum.top=30
trading.momentum.liquid-rank=200
trading.momentum.regime-sma=100
# Paper portfolio for the list (tables momentum_paper_account/_position/_equity, separate from intraday):
# trades the month's list at live prices from 09:20, equity stored daily at 15:40. GET /analytics/momentum-paper
trading.momentum.paper.capital=100000
trading.momentum.paper.brokerage=0
trading.momentum.paper.slippage-pct=0.10
trading.momentum.paper.cash-yield-pct=6.5
# Long-term monitor (own thread, not the intraday scheduler): prices the momentum paper holdings every
# interval-seconds 09:16-15:29; Slack alert at warn-pct below the buy price and on a NIFTY day drop;
# stop-pct > 0 paper-sells at stop-check what is still that far down (0 = alerts only). weekly-entry:
# a cash month buys the list in the first week NIFTY closes back above its average. GET /analytics/long-term-monitor
trading.long-term.enabled=true
trading.long-term.interval-seconds=60
trading.long-term.warn-pct=10
trading.long-term.stop-pct=0
trading.long-term.stop-check=15:20
trading.long-term.nifty-drop-pct=2.5
trading.momentum.weekly-entry=false
